# 发布：推 v* 标签时构建服务端镜像 + Android APK。
#
# 关键顺序：**先构建、先冒烟、后推送**。镜像只有在容器里真跑起来、/healthz 与 /readyz
# 都符合契约之后才 push 到 GHCR——坏镜像不会进发布通道，也不会顶掉 :latest。
# 冒烟逻辑与 ci.yml 的 docker job 共用 scripts/docker-smoke.sh，改断言只改一处。
#
# 手动干跑（验证发布流水线本身，不推送）：gh workflow run release --ref <分支> -f dry_run=true
#   —— 只跑 server-image（构建 + 冒烟），不跑 APK、不登录 GHCR、不推送。
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只构建 + 冒烟，不推送到 GHCR"
        type: boolean
        default: true
      build_android:
        description: "干跑时也构建 Android APK（用于验证签名分支，不推 Release）"
        type: boolean
        default: false

# 顶层最小权限；只有 server-image 为推 GHCR 提权（全仓唯一提权 workflow）
permissions:
  contents: read

jobs:
  # ── 版本号一致性 ───────────────────────────────────────────────────
  # Cargo.toml / app/pubspec.yaml / git tag 三处必须同版本；安装包与 APK 的版本号都从
  # 同一个来源推导（安装包由 ISCC /DMyAppVersion 注入，APK 由 pubspec 的 version 决定），
  # 所以这里卡住就等于卡住了四个产物版本。
  version-check:
    name: 版本号一致性（tag / Cargo.toml / pubspec.yaml）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 校验三处版本一致
        run: |
          set -euo pipefail
          cargo_version=$(awk -F'"' '/^\[workspace\.package\]/{f=1;next} f&&/^\[/{exit} f&&/^version[[:space:]]*=/{print $2;exit}' Cargo.toml)
          pubspec_version=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)(\+[0-9]+)?.*/\1/p' app/pubspec.yaml | head -n 1)
          echo "Cargo.toml=$cargo_version  pubspec.yaml=$pubspec_version  ref=$GITHUB_REF_NAME ($GITHUB_REF_TYPE)"
          [ -n "$cargo_version" ] && [ -n "$pubspec_version" ] || { echo "::error::读不到版本号"; exit 1; }
          [ "$cargo_version" = "$pubspec_version" ] || { echo "::error::Cargo.toml 与 pubspec.yaml 版本不一致"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            [ "$tag_version" = "$cargo_version" ] || { echo "::error::tag $GITHUB_REF_NAME 与 Cargo.toml $cargo_version 不一致"; exit 1; }
          fi

  # ── 服务端镜像 → GHCR ──────────────────────────────────────────────
  server-image:
    name: 服务端镜像（GHCR）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      # tag push 一律推送；workflow_dispatch 默认干跑（dry_run=true）
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # 校验"标签指向 main 上的提交"需要完整历史
          fetch-depth: 0
      - name: 校验 tag 在 main 上（发布只从 main 打标签）
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::${GITHUB_REF_NAME} 指向的提交不在 main 上"; exit 1; }
      - name: 校验 tag 与 workspace 版本一致
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ws=$(awk -F'"' '/^\[workspace\.package\]/{f=1; next} f && /^\[/{exit} f && /^version[[:space:]]*=/{print $2; exit}' Cargo.toml)
          [ -n "$ws" ] || { echo "::error::读不到 Cargo.toml 的 [workspace.package].version"; exit 1; }
          echo "tag=$tag workspace_version=$ws"
          [ "$tag" = "$ws" ] \
            || { echo "::error::tag v$tag 与 Cargo.toml workspace 版本 $ws 不一致——先对齐版本号再打标签"; exit 1; }
          # 端侧版本由 app/pubspec.yaml 维护，不一致只警告（APK 版本号会对不上，但不阻塞镜像发布）
          app_ver=$(sed -n 's/^version:[[:space:]]*//p' app/pubspec.yaml | head -n 1)
          case "$app_ver" in
            "$tag"+*) echo "app_version=$app_ver" ;;
            *) echo "::warning::app/pubspec.yaml 版本是 '$app_ver'，与 tag v$tag 不一致" ;;
          esac
      - name: 启用 buildx
        uses: docker/setup-buildx-action@v4
      # 分支名（干跑时）含 / 不能直接当镜像 tag，这里统一归一化；tag push 时 vX.Y.Z 原样保留
      - name: 计算镜像 tag
        id: tag
        run: |
          set -euo pipefail
          tag=$(printf '%s' "$GITHUB_REF_NAME" | tr '/:@ ' '----')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image_tag=$tag"
      # GHCR 仓库名必须全小写：组织名含大写时用 tr 归一化
      - name: 计算镜像名（小写）
        id: image
        run: |
          echo "name=ghcr.io/${{ github.repository_owner }}/yunong-server" \
            | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"
      # 镜像 OCI label 用的构建元数据：release 的 tag 就是版本号，时间用构建时刻
      - name: 记录构建元数据（镜像 label 用）
        id: meta
        run: |
          set -euo pipefail
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # 只 load 到 runner 本地：冒烟通过之后才推，顺序不能反
      - name: 构建（load 到本地，先不推送）
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.server
          push: false
          load: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.tag.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          # 发布出去的镜像必须能回答"跑的是哪个提交"（org.opencontainers.image.revision）
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VERSION=${{ steps.meta.outputs.version }}
          # 与 ci.yml 的 docker job 共用同一个 gha 缓存（默认 scope=buildkit）
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 镜像冒烟（真起容器探 /healthz、/readyz，检查二进制大小与 uid）
        run: |
          bash scripts/docker-smoke.sh \
            "${{ steps.image.outputs.name }}:${{ steps.tag.outputs.tag }}" \
            yunong-release-smoke 18080
      # 用内置 GITHUB_TOKEN，不额外建 PAT（PAT 是长期凭据，泄露面更大）
      - name: 登录 GHCR
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 推送镜像（冒烟通过之后）
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          docker push "${{ steps.image.outputs.name }}:${{ steps.tag.outputs.tag }}"
          docker push "${{ steps.image.outputs.name }}:latest"
      - name: 干跑说明
        if: env.DRY_RUN == 'true'
        run: |
          echo "DRY_RUN=true：镜像 ${{ steps.image.outputs.name }}:${{ steps.tag.outputs.tag }} 已构建并冒烟通过，未推送到 GHCR"

  # ── Android APK ───────────────────────────────────────────────────
  # 签名 secrets 一律先经 job 级 env 中转：secrets 上下文不能直接写进 if 表达式
  android:
    name: Android APK
    # 标签发布必跑；干跑时可用 build_android=true 单验签名分支（t164：否则这条链路只有打 tag 才被跑到）
    if: github.event_name == 'push' || inputs.build_android == true
    needs: version-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: 安装 Flutter（stable + 缓存 SDK）
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter pub get
        working-directory: app
        run: flutter pub get
      # t175 P0：发布 APK 必须自带 Rust 端侧核心（之前这里漏了，发出去的 APK 里没有
      # libyunong_core.so → 手机上 dlopen 失败、端侧核心不可用）。与 ci.yml 的 android-apk 保持同一套。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: 确保 NDK 可用
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -n "${ANDROID_NDK_HOME:-}" ] && [ -d "${ANDROID_NDK_HOME:-}" ]; then echo "NDK: $ANDROID_NDK_HOME"; exit 0; fi
          if [ -d "$sdk/ndk" ] && [ -n "$(ls -A "$sdk/ndk" 2>/dev/null)" ]; then echo "NDK: $(ls -A "$sdk/ndk")"; exit 0; fi
          echo "::notice::runner 无预装 NDK，安装 ndk;27.2.12479018"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
      - name: 交叉编译 Rust 端侧核心（arm64-v8a）
        run: pwsh scripts/build-android-core.ps1 -Abi arm64-v8a
      # 四个签名 secret 齐备才走 release 签名
      - name: 解码 keystore 并写 key.properties
        if: env.KEYSTORE_BASE64 != ''
        working-directory: app
        run: |
          set -euo pipefail
          echo "using release keystore (KEYSTORE_BASE64 已配置，alias=$KEY_ALIAS)"
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          # 仅落在 runner 本地工作区，随 job 结束销毁
      # 统一只跑 **release** 构建（t177 教训）：
      #   `flutter build apk --debug` 会忽略 --target-platform，debug 包永远带三 ABI，
      #   而 Rust 核心只编了 arm64 → 必然出现"Flutter 有、核心没有"的残缺包。
      #   没有 keystore 时 gradle 会回退 debug 签名（app/android/app/build.gradle.kts 里配好），
      #   所以"没 Secrets"不再需要退到 debug 构建：产物仍是 release 二进制 + debug 签名。
      - name: 构建 APK（release 二进制；无 Secrets 时用 debug 签名）
        working-directory: app
        run: |
          set -euo pipefail
          if [ -f android/key.properties ]; then
            echo "signing=release keystore（KEYSTORE_BASE64 已配置）"
          else
            echo "signing=fallback to debug signing (secrets missing)"
            echo "::warning::未配置签名 secrets，本产物用 debug keystore 签名，不可用于正式发布"
          fi
          echo "--- gradle 里的 abiFilters（构建前打印）---"
          grep -A2 'ndk {' android/app/build.gradle.kts || true
          flutter build apk --release --target-platform android-arm64
      # 护栏（t175/t177）：APK 必须内含 lib/arm64-v8a/libyunong_core.so，且 native libs 只能有一个 ABI。
      # 这是"CI 绿但发出去的包缺库"的最后一道防线；对目录里**每个** APK 都检查（不只看第一个）。
      - name: 护栏：APK 内含 libyunong_core.so 且只有单 ABI
        working-directory: app
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then echo "::error::没有产出 APK"; exit 1; fi
          failed=0
          for apk in "${apks[@]}"; do
            echo "检查：$apk ($(du -h "$apk" | cut -f1))"
            echo "--- APK 里的 lib/ ---"
            unzip -l "$apk" | awk '$4 ~ /^lib\// {print}'
            if ! unzip -l "$apk" | grep -q 'lib/arm64-v8a/libyunong_core.so'; then
              echo "::error::$apk 里没有 lib/arm64-v8a/libyunong_core.so —— 装到手机会 dlopen 失败"
              failed=1
              continue
            fi
            abis=$(unzip -l "$apk" | awk '$4 ~ /^lib\// {split($4,a,"/"); print a[2]}' | sort -u | tr '\n' ' ')
            echo "ABI：$abis"
            if [ "$(echo $abis | wc -w)" -ne 1 ] || [ "$(echo $abis | tr -d ' ')" != "arm64-v8a" ]; then
              echo "::error::$apk 含多个 ABI（$abis）：Rust 核心只有 arm64-v8a，混合包在其它 ABI 上必坏"
              failed=1
              continue
            fi
            echo "OK：$apk 内含 libyunong_core.so，且只有 arm64-v8a"
          done
          exit $failed

      # 护栏（t164）：配了 Secrets 却还是 debug 签名 → 直接失败，避免"以为签了其实没签"。
      # 判据用 apksigner 打印的证书 DN：debug keystore 固定是 CN=Android Debug。
      - name: 护栏：有 Secrets 时禁止产出 debug 签名
        if: env.KEYSTORE_BASE64 != ''
        working-directory: app
        run: |
          set -euo pipefail
          apk=$(ls build/app/outputs/flutter-apk/*.apk | head -n 1)
          echo "检查 APK 签名：$apk"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          [ -x "$apksigner" ] || { echo "::error::找不到 apksigner（ANDROID_HOME=$ANDROID_HOME）"; exit 1; }
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::已配置 KEYSTORE_BASE64，但 APK 仍由 debug keystore 签名——检查 key.properties / signingConfigs"
            exit 1
          fi
          echo "OK：APK 由 release keystore 签名（非 Android Debug）"

      # 产物校验和：下载方可以 sha256sum -c 验证，发布产物不带校验和等于让人盲信
      - name: 生成 APK 校验和
        working-directory: app/build/app/outputs/flutter-apk
        run: |
          set -euo pipefail
          sha256sum ./*.apk | tee SHA256SUMS
      - name: 上传 APK 与校验和
        uses: actions/upload-artifact@v7
        with:
          # 不能直接用 ref_name：干跑分支名带 / 时 artifact 名非法（与 windows 安装包同一坑）
          name: yunong-apk-${{ github.run_number }}-${{ github.ref_name == 'main' && 'main' || 'branch' }}
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/app/outputs/flutter-apk/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      # 打 tag 发布时把 APK 挂到 GitHub Release（artifact 只是 CI 内部留存，用户不下载）
      - name: 上传 APK 到 Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/app/outputs/flutter-apk/SHA256SUMS

  # ── Windows 安装包（Inno Setup）──────────────────────────────────────
  # 选 Inno Setup 而不是 WiX：单文件 .iss + 一条 ISCC 命令即可进 CI，中文界面/快捷方式/
  # 卸载器都是声明式配置，卸载回调能写 Pascal（"保留用户数据并提示位置"用它实现）。
  #
  # 干跑（workflow_dispatch）也会构建安装包并做"静默安装 → 校验 DLL 齐全 → 静默卸载 →
  # 确认用户数据未被删"的闭环，只是不上传 Release——这条链路只有真跑才可信。
  windows-installer:
    name: Windows 安装包（Inno Setup）
    runs-on: windows-latest
    timeout-minutes: 60
    needs: version-check
    permissions:
      contents: write
    env:
      # windows-latest 的 MSVC 14.51 已把 <experimental/coroutine> 变成硬错误（STL1011 / C2338），
      # 而 flutter_inappwebview_windows 的插件工程仍在用 /await。这是微软给的抑制开关，
      # 等插件升级后可以删掉；本地 VS 2022 不需要。
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # flutter_inappwebview 的 Windows 实现要 nuget 拉 nlohmann.json，缺了会 MSB3073
      - name: 安装 nuget 与 Inno Setup 6
        run: choco install nuget.commandline innosetup -y --no-progress
      - name: 构建应用（Flutter Windows + Rust core DLL）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pwsh scripts/build-windows-app.ps1

      # 护栏（t154 P0）：在 Release 目录里跑过一次 App 就会生成 yunong.exe.WebView2/EBWebView，
      # 里面是本机 Cookie / Login Data。必须在打包**之前**挡住（脚本内部还会再断言一次）。
      - name: 护栏 A：产物目录不得含 WebView2 用户数据 / 数据库 / 密钥 / 调试符号
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "app/build/windows/x64/runner/Release"
          if (-not (Test-Path $dir)) { throw "产物目录不存在：$dir" }
          $bad = @(Get-ChildItem $dir -Recurse -Force -ErrorAction SilentlyContinue | Where-Object {
              $_.Name -like "*.WebView2" -or $_.Name -eq "EBWebView" -or
              $_.Name -like "*.db" -or $_.Name -eq "secrets" -or
              $_.Name -like "*.pdb" -or $_.Name -eq ".env" -or
              $_.Name -like "*.jks" -or $_.Name -like "*.keystore" })
          if ($bad.Count -gt 0) {
            $list = ($bad | Select-Object -First 20 | ForEach-Object { $_.FullName }) -join "`n"
            throw "Release 目录含不该发布的内容（$($bad.Count) 项）：`n$list"
          }
          Write-Host "OK：Release 目录干净（无 WebView2/DB/secrets/pdb/.env）"

      - name: 构建安装包（白名单暂存 + ISCC）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "version=$version"
          pwsh scripts/build-windows-installer.ps1 -Version $version -SkipAppBuild -OutputDir dist
          Get-ChildItem dist | Format-Table Name,Length

      # 端到端验证：静默装到临时目录 → 三个 DLL 与 data\ 都在 → 静默卸载 → 用户数据仍保留
      - name: 从零安装验证（静默安装/卸载 + 用户数据保留）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Get-ChildItem dist -Filter "WindowOfYNAU-*-setup.exe" | Select-Object -First 1).FullName
          $target = Join-Path $env:RUNNER_TEMP "ynau-install"
          $sentinelDir = Join-Path $env:LOCALAPPDATA "yunong"
          New-Item -ItemType Directory -Force -Path $sentinelDir | Out-Null
          $sentinel = Join-Path $sentinelDir "ci-sentinel.txt"
          "keep me" | Set-Content $sentinel

          Start-Process -Wait -FilePath $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$target")
          foreach ($f in @("yunong.exe", "yunong_core.dll", "flutter_windows.dll")) {
              $p = Join-Path $target $f
              if (-not (Test-Path $p)) { throw "安装后缺少 $f（DLL 必须与 exe 同目录）" }
              Write-Host ("OK {0} = {1:N1} MB" -f $f, ((Get-Item $p).Length / 1MB))
          }
          if (-not (Test-Path (Join-Path $target "data"))) { throw "安装后缺少 data\ 目录" }
          # 护栏 B（t154 最终验收点）：装出来的目录里不许有 WebView2 用户数据 / 数据库
          $leaked = @(Get-ChildItem $target -Recurse -Force -ErrorAction SilentlyContinue | Where-Object {
              $_.Name -like "*.WebView2" -or $_.Name -eq "EBWebView" -or $_.Name -like "*.db" -or $_.Name -eq "secrets" })
          if ($leaked.Count -gt 0) { throw "安装包内含用户数据：$(($leaked | ForEach-Object { $_.FullName }) -join ', ')" }
          Write-Host "OK：安装目录内无 WebView2 用户数据 / 数据库"

          $unins = Get-ChildItem $target -Filter "unins*.exe" | Select-Object -First 1
          if (-not $unins) { throw "安装包没有卸载程序" }
          Start-Process -Wait -FilePath $unins.FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART")
          if (-not (Test-Path $sentinel)) { throw "卸载把用户数据删了：必须保留 %LOCALAPPDATA%\yunong" }
          Write-Host "卸载后用户数据仍保留：$sentinel"
      - name: 上传安装包与校验和
        uses: actions/upload-artifact@v7
        with:
          # 不能直接用 ref_name：分支名带 / 时 artifact 名非法（干跑会红）
          name: yunong-windows-setup-${{ github.run_number }}
          path: |
            dist/*.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: 上传安装包到 Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS
