# 主 CI：PR 与 push main 触发；四类检查独立，便于快速定位失败原因
# 名称保持小写：分支保护的状态检查名是「ci / rust」「ci / flutter」「ci / docs」「ci / migrations」「ci / pg」
name: ci

on:
  push:
    branches: [main]
  pull_request:

# 同一分支/PR 的旧运行自动取消，省配额
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 顶层最小权限：本 workflow 只读仓库内容，子 job 不另行提权
permissions:
  contents: read

jobs:
  rust:
    name: Rust（fmt / clippy / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 不把 token 写进 .git/config，后续步骤无从读取
          persist-credentials: false
      - name: 安装 stable 工具链（含 rustfmt、clippy）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # 缓存 ~/.cargo 与 target，命中时显著缩短构建
      - name: 缓存 cargo 构建产物
        uses: Swatinem/rust-cache@v2
      - name: cargo fmt（只检查，不写文件）
        run: cargo fmt --all -- --check
      - name: cargo clippy（警告即失败）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  flutter:
    name: Flutter（analyze / test）
    runs-on: ubuntu-latest
    # 端侧是主交付物之一，明确不允许容错：失败必须阻断
    continue-on-error: false
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 安装 Flutter（stable + 缓存 SDK）
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter pub get
        run: flutter pub get
      - name: flutter analyze
        run: flutter analyze
      - name: flutter test
        run: flutter test

  docs:
    name: 文档（表格 / 相对链接）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 安装 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # 脚本仅用标准库，无需安装依赖
      - name: 校验 docs
        run: python scripts/check_docs.py docs

  migrations:
    name: 迁移脚本（PG16 + pgvector）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # runner 自带 psql；ON_ERROR_STOP=1 保证任一条失败即整体失败
      - name: 按文件名顺序执行 crates/server/migrations/*.sql
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(crates/server/migrations/*.sql)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "没有迁移文件，跳过"
            exit 0
          fi
          while IFS= read -r f; do
            echo "==> psql -f $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done < <(printf '%s\n' "${files[@]}" | sort)

  # 真实的 PostgreSQL 上跑 auth 的 SQL：migrations job 只证明"迁移能落"，
  # 这个 job 证明"注册/登录/刷新/登出/校验这几条 SQL 在真库里真的对"。
  pg:
    name: PostgreSQL（auth 真实 SQL 集成测试）
    runs-on: ubuntu-latest
    # 与 migrations 同一个镜像：迁移 0001 用了 pgvector 的 vector 类型与 hnsw 索引
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yunong_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: yunong_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/yunong_test
      # 用例靠这个开关区分"跳过"与"失败"：CI 里必须真跑，不允许静默跳过
      YUNONG_PG_TESTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 安装 stable 工具链
        uses: dtolnay/rust-toolchain@stable
      - name: 缓存 cargo 构建产物
        uses: Swatinem/rust-cache@v2
      # 先按生产的方式用 psql 跑一遍迁移：迁移文件本身得能落（与 migrations job 同款）
      - name: 按文件名顺序执行 crates/server/migrations/*.sql
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(crates/server/migrations/*.sql)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "没有迁移文件，跳过"
            exit 0
          fi
          while IFS= read -r f; do
            echo "==> psql -f $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done < <(printf '%s\n' "${files[@]}" | sort)
      # 用例都带 #[ignore]（没装 PG 的机器上 cargo test 不能红）：
      # 不加 --include-ignored 就会"绿但一条 SQL 都没跑"，那正是这个 job 要防的事
      - name: cargo test（auth 的 PostgreSQL 集成测试，含 #[ignore] 用例）
        run: cargo test -p yunong-server --test pg_auth -- --include-ignored
      # 记账 upsert（usage_samples 的 ON CONFLICT）与审计写入（audit_logs 三类事件）
      # 这些**真实 SQL** 只活在 chat_stream 的 #[ignore] 用例里：不接进来的话，
      # CI 一直是绿的，但审计/记账的 SQL 从未在 CI 上被验证过。
      # 迁移由上面那步按文件名 glob 全量应用（0001→0004），不需要额外前置。
      - name: cargo test（对话链路的 PostgreSQL 集成测试，含 #[ignore] 用例）
        run: |
          set -euo pipefail
          out=$(cargo test -p yunong-server --test chat_stream -- --include-ignored 2>&1)
          printf '%s\n' "$out" | tail -n 25
          # 防假绿：忽略数必须为 0。有人删掉 --include-ignored 时会立刻红，
          # 而不是静静变成"跑过但全跳过"。
          printf '%s\n' "$out" | grep -q "0 ignored" \
            || { echo "::error::chat_stream 的 #[ignore] 用例没有真跑（检查 --include-ignored）"; exit 1; }
