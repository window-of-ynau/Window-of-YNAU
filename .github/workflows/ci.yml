# 主 CI：PR 与 push main 触发；各 job 独立，便于快速定位失败原因
# 分支保护的必需检查名 = 下面各 job 的 name:（「ci / rust」「ci / flutter」「ci / docs」
# 「ci / migrations」「ci / pg」）。改 name: 前必须用 gh api 同步分支保护，否则保护会静默失效。
name: ci

on:
  push:
    branches: [main]
  pull_request:

# 同一分支/PR 的旧运行自动取消，省配额
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 顶层最小权限：本 workflow 只读仓库内容，子 job 不另行提权
permissions:
  contents: read

jobs:
  rust:
    name: Rust（fmt / clippy / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 不把 token 写进 .git/config，后续步骤无从读取
          persist-credentials: false
      - name: 安装 stable 工具链（含 rustfmt、clippy）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # 缓存 ~/.cargo 与 target，命中时显著缩短构建
      - name: 缓存 cargo 构建产物
        uses: Swatinem/rust-cache@v2
      - name: cargo fmt（只检查，不写文件）
        run: cargo fmt --all -- --check
      - name: cargo clippy（警告即失败）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  flutter:
    name: Flutter（analyze / test）
    runs-on: ubuntu-latest
    # 端侧是主交付物之一，明确不允许容错：失败必须阻断
    continue-on-error: false
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 安装 Flutter（stable + 缓存 SDK）
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter pub get
        run: flutter pub get
      - name: flutter analyze
        run: flutter analyze
      - name: flutter test
        run: flutter test

  docs:
    name: 文档（表格 / 相对链接）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 安装 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # 脚本仅用标准库，无需安装依赖
      - name: 校验 docs
        run: python scripts/check_docs.py docs

  migrations:
    name: 迁移脚本（PG16 + pgvector）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # runner 自带 psql；ON_ERROR_STOP=1 保证任一条失败即整体失败
      - name: 按文件名顺序执行 crates/server/migrations/*.sql
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(crates/server/migrations/*.sql)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "没有迁移文件，跳过"
            exit 0
          fi
          while IFS= read -r f; do
            echo "==> psql -f $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done < <(printf '%s\n' "${files[@]}" | sort)

  # 真实的 PostgreSQL 上跑 auth 的 SQL：migrations job 只证明"迁移能落"，
  # 这个 job 证明"注册/登录/刷新/登出/校验这几条 SQL 在真库里真的对"。
  pg:
    name: PostgreSQL（auth 真实 SQL 集成测试）
    runs-on: ubuntu-latest
    # 与 migrations 同一个镜像：迁移 0001 用了 pgvector 的 vector 类型与 hnsw 索引
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yunong_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: yunong_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/yunong_test
      # 用例靠这个开关区分"跳过"与"失败"：CI 里必须真跑，不允许静默跳过
      YUNONG_PG_TESTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 安装 stable 工具链
        uses: dtolnay/rust-toolchain@stable
      - name: 缓存 cargo 构建产物
        uses: Swatinem/rust-cache@v2
      # 先按生产的方式用 psql 跑一遍迁移：迁移文件本身得能落（与 migrations job 同款）
      - name: 按文件名顺序执行 crates/server/migrations/*.sql
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(crates/server/migrations/*.sql)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "没有迁移文件，跳过"
            exit 0
          fi
          while IFS= read -r f; do
            echo "==> psql -f $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done < <(printf '%s\n' "${files[@]}" | sort)
      # 用例都带 #[ignore]（没装 PG 的机器上 cargo test 不能红）：
      # 不加 --include-ignored 就会"绿但一条 SQL 都没跑"，那正是这个 job 要防的事
      - name: cargo test（auth 的 PostgreSQL 集成测试，含 #[ignore] 用例）
        run: cargo test -p yunong-server --test pg_auth -- --include-ignored
      # 记账 upsert（usage_samples 的 ON CONFLICT）与审计写入（audit_logs 三类事件）
      # 这些**真实 SQL** 只活在 chat_stream 的 #[ignore] 用例里：不接进来的话，
      # CI 一直是绿的，但审计/记账的 SQL 从未在 CI 上被验证过。
      # 迁移由上面那步按文件名 glob 全量应用（0001→0004），不需要额外前置。
      - name: cargo test（对话链路的 PostgreSQL 集成测试，含 #[ignore] 用例）
        run: |
          # 不用 `set -e`：cargo 挂了也要先把输出打出来，否则 CI 上只剩 exit code 1，
          # 看不到是哪条 SQL 挂了——最需要诊断力的时候恰恰是失败时。
          set -uo pipefail
          if ! out=$(cargo test -p yunong-server --test chat_stream -- --include-ignored 2>&1); then
            printf '%s\n' "$out" | tail -n 60
            echo "::error::chat_stream 集成测试失败（完整输出见上）"
            exit 1
          fi
          printf '%s\n' "$out" | tail -n 25
          # 防假绿（锚定整行）：只认 `0 failed; 0 ignored` 的汇总行。
          # 不能用子串 `"0 ignored"`——`"10 ignored"` / `"20 ignored"` 里也含它。
          summary=$(printf '%s\n' "$out" | grep -E '^test result: ok\. [0-9]+ passed; 0 failed; 0 ignored' | tail -n 1)
          if [ -z "$summary" ]; then
            echo "::error::chat_stream 的 #[ignore] 用例没有真跑（检查 --include-ignored）"
            exit 1
          fi
          # 再卡一道下限：真跑了才是绿的（防"0 passed"这种形态也算绿）
          passed=$(printf '%s\n' "$summary" | sed -E 's/^test result: ok\. ([0-9]+) passed.*/\1/')
          if [ "$passed" -lt 20 ]; then
            echo "::error::只跑了 $passed 条用例（预期 ≥20）"
            exit 1
          fi

  # 镜像构建 + 冒烟：本轮踩过"镜像里打包的是空壳二进制"——Dockerfile 的依赖缓存层带着
  # 空壳源码的 mtime，`COPY crates` 后 cargo 认为没变化、跳过重编，镜像里就装了个
  # 立刻退出的 `fn main(){}`（314KB、exit 0、无日志）。当时只能人工 `docker run` 才发现，
  # 所以这里在每次 PR / push main 都真 build、真起容器、真探 /healthz：
  # 空壳二进制会马上退出 → 健康检查拿不到响应 → job 红。
  #
  # 耗时：buildx 的 gha 缓存与 release.yml 共用（默认 scope=buildkit）。命中约 1~2 分钟，
  # 冷启（缓存被淘汰/首次）约 8~12 分钟，故 timeout 给到 25 分钟。
  # 本 job 目前**不在**分支保护的必需检查里：先只提供信号，等它稳定跑绿若干次后，
  # 再由维护者用 gh api 把「ci / 服务端镜像（build + /healthz 冒烟）」加进 required checks。
  docker:
    name: 服务端镜像（build + /healthz 冒烟）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # 便宜的护栏：compose 插值、迁移脚本语法错了直接红，不用等镜像构建
      - name: 校验 compose 与迁移脚本可解析
        env:
          POSTGRES_PASSWORD: ci-dummy
          DATABASE_URL: postgres://yunong:ci-dummy@db:5432/yunong
        run: |
          set -euo pipefail
          docker compose -f deploy/docker-compose.yml config --quiet
          sh -n deploy/migrate.sh
      # type=gha 缓存与 load: true 都需要 docker-container driver（setup-buildx 的默认）
      - name: 启用 buildx
        uses: docker/setup-buildx-action@v3
      - name: docker build（deploy/Dockerfile.server）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.server
          push: false
          load: true
          tags: yunong-server:ci
          # 与 release.yml 同一个 gha 缓存：CI 暖的缓存，打标签发布时直接复用
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 冒烟逻辑在 scripts/docker-smoke.sh：release.yml 打标签发布时调同一个脚本，
      # 避免"CI 验的"和"发布验的"两处漂移；本机也能直接跑：
      #   bash scripts/docker-smoke.sh yunong-server:ci
      - name: 起容器并探 /healthz（scripts/docker-smoke.sh）
        run: bash scripts/docker-smoke.sh yunong-server:ci yunong-ci 18080
