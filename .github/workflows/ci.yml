# 主 CI：PR 与 push main 触发；各 job 独立，便于快速定位失败原因
# 分支保护的必需检查名 = 下面各 job 的 name:（「ci / rust」「ci / flutter」「ci / docs」
# 「ci / migrations」「ci / pg」）。改 name: 前必须用 gh api 同步分支保护，否则保护会静默失效。
name: ci

on:
  push:
    branches: [main]
  pull_request:

# 同一分支/PR 的旧运行自动取消，省配额
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 顶层最小权限：本 workflow 只读仓库内容，子 job 不另行提权
permissions:
  contents: read

jobs:
  rust:
    name: Rust（fmt / clippy / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 不把 token 写进 .git/config，后续步骤无从读取
          persist-credentials: false
      - name: 安装 stable 工具链（含 rustfmt、clippy）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # 缓存 ~/.cargo 与 target，命中时显著缩短构建
      - name: 缓存 cargo 构建产物
        uses: Swatinem/rust-cache@v2
      - name: cargo fmt（只检查，不写文件）
        run: cargo fmt --all -- --check
      - name: cargo clippy（警告即失败）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  flutter:
    name: Flutter（analyze / test）
    runs-on: ubuntu-latest
    # 端侧是主交付物之一，明确不允许容错：失败必须阻断
    continue-on-error: false
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 安装 Flutter（stable + 缓存 SDK）
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter pub get
        run: flutter pub get
      - name: flutter analyze
        run: flutter analyze
      - name: flutter test
        run: flutter test

  # 端侧真 DLL 端到端：构建 core 的 cdylib + fake_sse，设 YUNONG_CORE_DLL 后跑
  # app/test/t79_fake_sse_integration_test.dart —— 这条护栏验证"注册早于调用"后真能收到 delta/done。
  #
  # 为什么单独一个 job：该用例在**没设** YUNONG_CORE_DLL 时会 markTestSkipped（Flutter job 里就是
  # 这个状态：`292 tests passed, 1 skipped`）。我们最有价值的端到端护栏不能默认不跑，所以这里
  # 显式设环境变量 + 断言"必须真跑、一条都不许 skip"（skip 即红）。
  dll-e2e:
    name: 端侧真 DLL 端到端（fake_sse 全链路）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建 core cdylib 与 fake_sse 假上游
        run: |
          set -euo pipefail
          cargo build -p yunong-core --example fake_sse
          cargo build -p yunong-core
          ls -l target/debug/libyunong_core.so target/debug/examples/fake_sse
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter pub get
        working-directory: app
        run: flutter pub get
      - name: 真 DLL 端到端（禁止 skip）
        working-directory: app
        env:
          # 用例的查找顺序：target/debug/*.dll → 环境变量；Linux 上是 libyunong_core.so
          YUNONG_CORE_DLL: ${{ github.workspace }}/target/debug/libyunong_core.so
        run: |
          set -uo pipefail
          # 不 set -e：失败时也要先把输出打出来，否则只剩 exit code
          if ! out=$(flutter test test/t79_fake_sse_integration_test.dart 2>&1); then
            printf '%s\n' "$out" | tail -n 60
            echo "::error::真 DLL 端到端失败（完整输出见上）"
            exit 1
          fi
          printf '%s\n' "$out" | tail -n 15
          # 防假绿（锚定整行）：这一条用例必须真跑，出现 skip 标记即红。
          if printf '%s\n' "$out" | grep -Eq 'All tests skipped|⏭️'; then
            echo "::error::用例被 skip 了：检查 YUNONG_CORE_DLL=$YUNONG_CORE_DLL 与 target/debug/examples/fake_sse 是否存在"
            exit 1
          fi
          # 锚定"确有 ✅ 的通过行"，而不是只看退出码。
          # 注意 reporter 的通过清单只打用例标题、不打文件路径（t93 踩过：按文件路径 grep 会误判）。
          if ! printf '%s\n' "$out" | grep -q '✅ Passing tests'; then
            echo "::error::没有看到 ✅ Passing tests 分组（用例可能没执行）"
            exit 1
          fi
          if ! printf '%s\n' "$out" | grep -Eq '^✅ '; then
            echo "::error::✅ Passing tests 分组里没有任何通过行"
            exit 1
          fi
          # 再卡一道下限：通过的条数 ≥ 1，且汇总行里不许出现 skipped
          summary=$(printf '%s\n' "$out" | grep -E '[0-9]+ tests? passed' | tail -n 1)
          if [ -z "$summary" ] || printf '%s' "$summary" | grep -q skipped; then
            echo "::error::测试汇总缺失或含 skipped：${summary:-<empty>}"
            exit 1
          fi
          passed=$(printf '%s' "$summary" | sed -E 's/.*[^0-9]([0-9]+) tests? passed.*/\1/')
          if [ "${passed:-0}" -lt 1 ]; then
            echo "::error::只跑了 ${passed:-0} 条用例（预期 ≥1）"
            exit 1
          fi
      # 工具事件端到端（t106）：fake_sse --mode tool 先回 tool_calls，第二次请求回文本 + done，
      # 客户端用真 DLL 跑完整链路，断言 tool_call → tool_result → delta → done 的顺序与配对。
      #
      # YUNONG_CORE_DLL **只在下面这条命令上设置**（step 级 env），不设 job 级、也不设到 flutter
      # 其它命令上：全局设置会让 widget 测试被带着走真 FFI 而失败（lead-client 实测）。
      # 本 job 与 Flutter job 是分开的，widget 测试那条链路永远看不到这个变量。
      #
      # t106 的测试若尚未合入 main，则只打警告并跳过本步（不阻塞主分支）；文件一出现就自动生效，
      # 之后走完整断言：不许 skip、必须真跑、输出里必须出现 tool_call 与 tool_result。
      - name: 工具事件端到端（t106，fake_sse --mode tool，禁止 skip）
        working-directory: app
        env:
          YUNONG_CORE_DLL: ${{ github.workspace }}/target/debug/libyunong_core.so
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(test/t106_*.dart)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::app/test/t106_*.dart 不存在（t106 尚未合入 main），跳过工具事件端到端；合入后本步自动生效"
            exit 0
          fi
          echo "运行：${files[*]}"
          if ! out=$(flutter test "${files[@]}" 2>&1); then
            printf '%s\n' "$out" | tail -n 60
            echo "::error::工具事件端到端失败（完整输出见上）"
            exit 1
          fi
          printf '%s\n' "$out" | tail -n 20
          # ① 不许 skip（未设 DLL 或 fake_sse 不再时它会静默跳过，那样等于没有护栏）
          if printf '%s\n' "$out" | grep -Eq 'All tests skipped|⏭️'; then
            echo "::error::工具事件用例被 skip 了：检查 YUNONG_CORE_DLL=$YUNONG_CORE_DLL 与 target/debug/examples/fake_sse"
            exit 1
          fi
          # ② 必须真有通过行
          if ! printf '%s\n' "$out" | grep -q '✅ Passing tests'; then
            echo "::error::没有看到 ✅ Passing tests 分组（工具事件用例可能没执行）"
            exit 1
          fi
          # ③ 工具事件确实出现：测试会把 wire JSON 打出来，两种事件名都要看到
          for token in tool_call tool_result; do
            if ! printf '%s\n' "$out" | grep -q "$token"; then
              echo "::error::输出里没有出现 $token —— 工具事件链路没有真正跑通"
              exit 1
            fi
          done
          summary=$(printf '%s\n' "$out" | grep -E '[0-9]+ tests? passed' | tail -n 1)
          if [ -z "$summary" ] || printf '%s' "$summary" | grep -q skipped; then
            echo "::error::测试汇总缺失或含 skipped：${summary:-<empty>}"
            exit 1
          fi
          passed=$(printf '%s' "$summary" | sed -E 's/.*[^0-9]([0-9]+) tests? passed.*/\1/')
          if [ "${passed:-0}" -lt 1 ]; then
            echo "::error::只跑了 ${passed:-0} 条工具事件用例（预期 ≥1）"
            exit 1
          fi
          echo "工具事件端到端：${passed} 条用例真跑通过（非 skip）"


  docs:
    name: 文档（表格 / 相对链接）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 安装 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # 脚本仅用标准库，无需安装依赖
      - name: 校验 docs
        run: python scripts/check_docs.py docs

  migrations:
    name: 迁移脚本（PG16 + pgvector）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # runner 自带 psql；ON_ERROR_STOP=1 保证任一条失败即整体失败。
      # `-1`（单事务）是硬要求（t81 / M2）：迁移里有 "DROP CONSTRAINT → ADD CONSTRAINT" 这类
      # 顺序敏感的 DDL，非单事务下 ADD 失败时 DROP 已经提交 ⇒ 约束永久丢失且退出码非 0，
      # 下次重跑会更糟。加上 `-1` 后任意一条失败整份回滚，库要么全旧要么全新。
      - name: 按文件名顺序执行 crates/server/migrations/*.sql
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(crates/server/migrations/*.sql)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "没有迁移文件，跳过"
            exit 0
          fi
          while IFS= read -r f; do
            echo "==> psql -1 -f $f"
            psql -v ON_ERROR_STOP=1 -q -1 -f "$f"
          done < <(printf '%s\n' "${files[@]}" | sort)

      # 上面那步只证明"全新库能把迁移落下去"。线上不会每次重建库：0003 改过唯一键、
      # 0004 改过 CHECK 约束，升级路径（老库 → 逐个新迁移）必须单独验，否则
      # "全新建库能过、老库升级炸掉"这类事故只有上线时才发现。
      # 用独立数据库，不污染上面刚建好的新库。
      - name: 升级路径（老库 0001+0002 → 0003 → 0004 → 全量重入）
        run: |
          set -euo pipefail
          db=yunong_upgrade
          psql -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE $db"
          mig() { psql -v ON_ERROR_STOP=1 -q -1 -d "$db" -f "$1"; }

          echo "== 老库：只跑 0001 + 0002"
          mig crates/server/migrations/0001_init.sql
          mig crates/server/migrations/0002_auth.sql

          echo "== 历史脏数据（老实现没有唯一键，同一轮重复行真实存在）"
          psql -v ON_ERROR_STOP=1 -q -d "$db" <<'SQL'
          INSERT INTO users (email) VALUES ('upgrade@example.com');
          INSERT INTO usage_samples (user_id, req_id, model, protocol, channel, round, tokens_in, tokens_out)
          SELECT id, 'req_upgrade', 'm', 'openai_completions', 'plan', 1, 10, 20
            FROM users WHERE email = 'upgrade@example.com';
          INSERT INTO usage_samples (user_id, req_id, model, protocol, channel, round, tokens_in, tokens_out)
          SELECT id, 'req_upgrade', 'm', 'openai_completions', 'plan', 1, 99, 99
            FROM users WHERE email = 'upgrade@example.com';
          INSERT INTO audit_logs (action, decision, reason)
          VALUES ('chat.stream', 'allow', NULL), ('chat.stream', 'deny', 'user_in_flight');
          SQL

          echo "== 升级：只跑 0003、0004（模拟线上老库升版本）"
          mig crates/server/migrations/0003_usage_turn_estimated.sql
          mig crates/server/migrations/0004_audit_decisions.sql

          echo "== 断言升级结果（任一不满足即红）"
          psql -v ON_ERROR_STOP=1 -q -d "$db" <<'SQL'
          DO $$
          DECLARE n int;
          BEGIN
            SELECT count(*) INTO n FROM usage_samples WHERE turn_id IS NULL;
            IF n <> 0 THEN RAISE EXCEPTION '0003 回填失败：% 行 turn_id 为空', n; END IF;

            SELECT count(*) INTO n FROM usage_samples WHERE req_id = 'req_upgrade' AND round = 1;
            IF n <> 1 THEN RAISE EXCEPTION '0003 去重失败：残留 % 行', n; END IF;

            -- 去重保留 id 最大的那行，所以终值应是后插入的 99/99
            SELECT count(*) INTO n FROM usage_samples WHERE req_id = 'req_upgrade' AND tokens_in = 99;
            IF n <> 1 THEN RAISE EXCEPTION '0003 去重保留的不是最新一行'; END IF;

            SELECT count(*) INTO n FROM pg_indexes
             WHERE tablename = 'usage_samples' AND indexname = 'ux_usage_user_turn_round';
            IF n <> 1 THEN RAISE EXCEPTION '缺唯一索引 ux_usage_user_turn_round'; END IF;

            -- 幂等键必须带 user_id（F11）：两个用户撞同一 turn_id 不能互相覆盖
            SELECT count(*) INTO n FROM pg_indexes
             WHERE tablename = 'usage_samples' AND indexdef LIKE '%UNIQUE%'
               AND indexdef LIKE '%user_id%' AND indexdef LIKE '%turn_id%' AND indexdef LIKE '%round%';
            IF n < 1 THEN RAISE EXCEPTION '唯一键没带全 (user_id, turn_id, round)'; END IF;

            SELECT count(*) INTO n FROM information_schema.columns
             WHERE table_name = 'usage_samples' AND column_name = 'estimated'
               AND is_nullable = 'NO' AND column_default LIKE 'false%';
            IF n <> 1 THEN RAISE EXCEPTION 'estimated 列缺失或默认值不对'; END IF;

            -- 0004：decision=error 必须被接受
            BEGIN
              INSERT INTO audit_logs (action, decision) VALUES ('chat.stream', 'error');
            EXCEPTION WHEN check_violation THEN
              RAISE EXCEPTION '0004 未生效：decision=error 被 CHECK 拒绝';
            END;

            -- 0004：非法 decision 必须被拒
            BEGIN
              INSERT INTO audit_logs (action, decision) VALUES ('chat.stream', 'bogus');
              RAISE EXCEPTION '0004 未生效：非法 decision 竟被接受';
            EXCEPTION WHEN check_violation THEN NULL;
            END;

            SELECT count(*) INTO n FROM pg_indexes
             WHERE tablename = 'audit_logs'
               AND indexname IN ('ix_audit_action_time', 'ix_audit_not_allow_time');
            IF n <> 2 THEN RAISE EXCEPTION '0004 索引缺失：% / 2', n; END IF;

            RAISE NOTICE '升级路径断言全部通过';
          END $$;
          SQL

          echo "== 可重入：全部迁移再跑一遍也必须成功"
          for f in crates/server/migrations/*.sql; do mig "$f"; done

          # t81 / M2：RAG 的 CHECK 约束**重跑后必须仍在**（旧写法会永久丢掉它）。
          psql -v ON_ERROR_STOP=1 -q -1 -d "$db" <<'SQL'
          DO $$
          DECLARE n int;
          BEGIN
            SELECT count(*) INTO n FROM pg_constraint
             WHERE conname = 'rag_candidates_status_check'
               AND conrelid = 'rag_candidates'::regclass;
            IF n <> 1 THEN RAISE EXCEPTION '重跑后丢了 rag_candidates_status_check'; END IF;

            BEGIN
              INSERT INTO rag_candidates (month, hash, status)
                  VALUES ('2026-11', 'deadbeef', 'weird_status');
              RAISE EXCEPTION '重跑后 CHECK 失效：weird_status 被接受';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END $$;
          SQL
          echo "升级路径 OK"

      # 0003 的注释承诺"已经把旧索引建出来的库也能重放"（半成品库），另外"空表升级"
      # 也是干净库天然会走到的形态。这两条单独验，避免只有"有脏数据的老库"被测到：
      #   ① 半成品：turn_id 已加、旧索引 ux_usage_turn_round 已建 → 新 0003 必须 DROP 旧索引并建新索引
      #   ② 空表：usage_samples 0 行 → 0003 的回填 UPDATE 空跑也必须安全
      - name: 升级路径②（半成品旧索引 / 空表）
        run: |
          set -euo pipefail
          # 注意：`-1` 只能加在 `-f`（整份迁移）上。`CREATE DATABASE` 不能在事务块里跑，
          # 所以前缀本身不带 `-1`（t81 / M2 的真实教训，CI 上踩过一次）。
          P="psql -v ON_ERROR_STOP=1 -q"

          echo "== ① 半成品库：旧版 0003 已经建过 ux_usage_turn_round"
          $P -c "CREATE DATABASE yunong_half"
          $P -d yunong_half -1 -f crates/server/migrations/0001_init.sql
          $P -d yunong_half -1 -f crates/server/migrations/0002_auth.sql
          $P -d yunong_half <<'SQL'
          INSERT INTO users (email) VALUES ('half@example.com');
          INSERT INTO usage_samples (user_id, req_id, model, protocol, channel, round, tokens_in, tokens_out)
          SELECT id, 'req_a', 'm', 'openai_completions', 'plan', 1, 1, 1
            FROM users WHERE email = 'half@example.com';
          -- 旧版 0003 的形态：列已加、值已回填、旧唯一索引已建（无重复行时才建得出来）
          ALTER TABLE usage_samples ADD COLUMN turn_id text;
          UPDATE usage_samples SET turn_id = req_id;
          CREATE UNIQUE INDEX ux_usage_turn_round ON usage_samples (turn_id, round);
          SQL
          $P -d yunong_half -1 -f crates/server/migrations/0003_usage_turn_estimated.sql
          $P -d yunong_half <<'SQL'
          DO $$
          BEGIN
            IF (SELECT count(*) FROM pg_indexes
                 WHERE tablename = 'usage_samples' AND indexname = 'ux_usage_turn_round') <> 0
              THEN RAISE EXCEPTION '半成品库：旧索引 ux_usage_turn_round 没被 DROP';
            END IF;
            IF (SELECT count(*) FROM pg_indexes
                 WHERE tablename = 'usage_samples' AND indexname = 'ux_usage_user_turn_round') <> 1
              THEN RAISE EXCEPTION '半成品库：新索引 ux_usage_user_turn_round 没建出来';
            END IF;
            RAISE NOTICE '半成品库升级断言通过';
          END $$;
          SQL

          echo "== ② 空表库：usage_samples 一行数据都没有"
          $P -c "CREATE DATABASE yunong_empty"
          $P -d yunong_empty -1 -f crates/server/migrations/0001_init.sql
          $P -d yunong_empty -1 -f crates/server/migrations/0002_auth.sql
          $P -d yunong_empty -1 -f crates/server/migrations/0003_usage_turn_estimated.sql
          $P -d yunong_empty -1 -f crates/server/migrations/0004_audit_decisions.sql

          echo "半成品 / 空表升级 OK"

  # 真实的 PostgreSQL 上跑 auth 的 SQL：migrations job 只证明"迁移能落"，
  # 这个 job 证明"注册/登录/刷新/登出/校验这几条 SQL 在真库里真的对"。
  pg:
    name: PostgreSQL（auth 真实 SQL 集成测试）
    runs-on: ubuntu-latest
    # 与 migrations 同一个镜像：迁移 0001 用了 pgvector 的 vector 类型与 hnsw 索引
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yunong_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: yunong_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/yunong_test
      # 用例靠这个开关区分"跳过"与"失败"：CI 里必须真跑，不允许静默跳过
      YUNONG_PG_TESTS_REQUIRED: "1"
      # RAG 抓取在 CI 里必须关掉（不联网）；rag_fetch 的用例用 mock fetcher，仍能跑
      RAG_FETCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 安装 stable 工具链
        uses: dtolnay/rust-toolchain@stable
      - name: 缓存 cargo 构建产物
        uses: Swatinem/rust-cache@v2
      # 先按生产的方式用 psql 跑一遍迁移：迁移文件本身得能落（与 migrations job 同款）
      - name: 按文件名顺序执行 crates/server/migrations/*.sql
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(crates/server/migrations/*.sql)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "没有迁移文件，跳过"
            exit 0
          fi
          while IFS= read -r f; do
            echo "==> psql -f $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done < <(printf '%s\n' "${files[@]}" | sort)
      # 用例都带 #[ignore]（没装 PG 的机器上 cargo test 不能红）：
      # 不加 --include-ignored 就会"绿但一条 SQL 都没跑"，那正是这个 job 要防的事
      - name: cargo test（auth 的 PostgreSQL 集成测试，含 #[ignore] 用例）
        run: cargo test -p yunong-server --test pg_auth -- --include-ignored
      # 记账 upsert（usage_samples 的 ON CONFLICT）与审计写入（audit_logs 三类事件）
      # 这些**真实 SQL** 只活在 chat_stream 的 #[ignore] 用例里：不接进来的话，
      # CI 一直是绿的，但审计/记账的 SQL 从未在 CI 上被验证过。
      # 迁移由上面那步按文件名 glob 全量应用（0001→0004），不需要额外前置。
      - name: cargo test（对话链路的 PostgreSQL 集成测试，含 #[ignore] 用例）
        run: |
          # 不用 `set -e`：cargo 挂了也要先把输出打出来，否则 CI 上只剩 exit code 1，
          # 看不到是哪条 SQL 挂了——最需要诊断力的时候恰恰是失败时。
          set -uo pipefail
          if ! out=$(cargo test -p yunong-server --test chat_stream -- --include-ignored 2>&1); then
            printf '%s\n' "$out" | tail -n 60
            echo "::error::chat_stream 集成测试失败（完整输出见上）"
            exit 1
          fi
          printf '%s\n' "$out" | tail -n 25
          # 防假绿（锚定整行）：只认 `0 failed; 0 ignored` 的汇总行。
          # 不能用子串 `"0 ignored"`——`"10 ignored"` / `"20 ignored"` 里也含它。
          summary=$(printf '%s\n' "$out" | grep -E '^test result: ok\. [0-9]+ passed; 0 failed; 0 ignored' | tail -n 1)
          if [ -z "$summary" ]; then
            echo "::error::chat_stream 的 #[ignore] 用例没有真跑（检查 --include-ignored）"
            exit 1
          fi
          # 再卡一道下限：真跑了才是绿的（防"0 passed"这种形态也算绿）
          passed=$(printf '%s\n' "$summary" | sed -E 's/^test result: ok\. ([0-9]+) passed.*/\1/')
          if [ "$passed" -lt 20 ]; then
            echo "::error::只跑了 $passed 条用例（预期 ≥20）"
            exit 1
          fi
      # RAG 的真实 SQL 用例（rag 19 条、rag_fetch 11 条）之前只在本地跑过——RAG 是安全敏感模块，
      # 这是 CI 最大的盲区。沿用上面同一套防假绿断言，用函数避免复制粘贴：加套件只改下面的表格。
      - name: cargo test（RAG / 抓取链路的 PostgreSQL 集成测试，含 #[ignore] 用例）
        run: |
          set -uo pipefail
          run_suite() {
            suite=$1
            min=$2
            if ! out=$(cargo test -p yunong-server --test "$suite" -- --include-ignored 2>&1); then
              printf '%s\n' "$out" | tail -n 60
              echo "::error::$suite 集成测试失败（完整输出见上）"
              return 1
            fi
            printf '%s\n' "$out" | tail -n 25
            # 防假绿（锚定整行）：只认 `0 failed; 0 ignored` 的汇总行，
            # 不能用子串 "0 ignored"（"10 ignored" / "20 ignored" 里也含它）。
            summary=$(printf '%s\n' "$out" | grep -E '^test result: ok\. [0-9]+ passed; 0 failed; 0 ignored' | tail -n 1)
            if [ -z "$summary" ]; then
              echo "::error::$suite 的 #[ignore] 用例没有真跑（检查 --include-ignored）"
              return 1
            fi
            passed=$(printf '%s\n' "$summary" | sed -E 's/^test result: ok\. ([0-9]+) passed.*/\1/')
            if [ "$passed" -lt "$min" ]; then
              echo "::error::$suite 只跑了 $passed 条用例（预期 ≥$min）"
              return 1
            fi
            echo "::notice::$suite 真跑了 $passed 条（下限 $min）"
          }
          fail=0
          run_suite rag 19 || fail=1          # 7 条纯内存 + 12 条 #[ignore] 真 SQL
          run_suite rag_fetch 11 || fail=1    # 11 条 #[ignore]，mock fetcher + 真库
          exit "$fail"

  # 镜像构建 + 冒烟：本轮踩过"镜像里打包的是空壳二进制"——Dockerfile 的依赖缓存层带着
  # 空壳源码的 mtime，`COPY crates` 后 cargo 认为没变化、跳过重编，镜像里就装了个
  # 立刻退出的 `fn main(){}`（314KB、exit 0、无日志）。当时只能人工 `docker run` 才发现，
  # 所以这里在每次 PR / push main 都真 build、真起容器、真探 /healthz：
  # 空壳二进制会马上退出 → 健康检查拿不到响应 → job 红。
  #
  # 耗时：buildx 的 gha 缓存与 release.yml 共用（默认 scope=buildkit）。命中约 1~2 分钟，
  # 冷启（缓存被淘汰/首次）约 8~12 分钟，故 timeout 给到 25 分钟。
  # 该 job 已是分支保护的必需检查（t46 加入）；改名=静默失效，改 name: 前先看 deploy/README。
  docker:
    name: 服务端镜像（build + /healthz 冒烟）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # 便宜的护栏：compose 插值、迁移脚本语法错了直接红，不用等镜像构建
      - name: 校验 compose 与迁移脚本可解析
        env:
          POSTGRES_PASSWORD: ci-dummy
          DATABASE_URL: postgres://yunong:ci-dummy@db:5432/yunong
        run: |
          set -euo pipefail
          docker compose -f deploy/docker-compose.yml config --quiet
          sh -n deploy/migrate.sh
      # type=gha 缓存与 load: true 都需要 docker-container driver（setup-buildx 的默认）
      - name: 启用 buildx
        uses: docker/setup-buildx-action@v4
      # 镜像 OCI label 用的构建元数据：commit / 构建时间 / 版本
      - name: 记录构建元数据（镜像 label 用）
        id: meta
        run: |
          set -euo pipefail
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          version=$(awk -F'"' '/^\[workspace\.package\]/{f=1; next} f && /^\[/{exit} f && /^version[[:space:]]*=/{print $2; exit}' Cargo.toml)
          [ -n "$version" ] || { echo "::error::读不到 Cargo.toml 的 [workspace.package].version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # 镜像里打 OCI label（org.opencontainers.image.revision 等）：容器跑的是哪个提交
      # 必须能从 `docker inspect` 回答，security 的 L3 复核专门提过这一点。
      - name: docker build（deploy/Dockerfile.server）
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.server
          push: false
          load: true
          tags: yunong-server:ci
          # 与 release.yml 同一个 gha 缓存：CI 暖的缓存，打标签发布时直接复用
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VERSION=${{ steps.meta.outputs.version }}
      # 冒烟逻辑在 scripts/docker-smoke.sh：release.yml 打标签发布时调同一个脚本，
      # 避免"CI 验的"和"发布验的"两处漂移；本机也能直接跑：
      #   bash scripts/docker-smoke.sh yunong-server:ci
      - name: 起容器并探 /healthz（scripts/docker-smoke.sh）
        run: bash scripts/docker-smoke.sh yunong-server:ci yunong-ci 18080

  # 依赖安全与许可证（cargo-deny）：RustSec 漏洞 / 许可证 / 禁用依赖 / 依赖来源。
  # 红队 L4 指出的缺口：之前 CI 完全不看依赖的已知漏洞，也没有许可证闸门。
  # 选 cargo-deny 而不是 cargo-audit：一次跑完漏洞 + 许可证 + 禁用依赖 + 来源，
  # 双许可项目更需要许可证闸门（理由与白名单见仓库根 deny.toml）。
  #
  # 阶段 2（当前）：基线已清零——升级 rustls 0.23.46 / tokio 1.54.1 /
  # rustls-webpki 0.103.16 / webpki-roots 1.0.11 后 advisories 变 ok，所以去掉
  # continue-on-error：命中即红。
  # 仍**不把该 job 加进分支保护必需检查**：先观察 3~5 个 PR 的稳定性与耗时，
  # 再一次性 gh api 加入（与 docker job 同一节奏，步骤见 deny.toml 顶部与 deploy/README）。
  security:
    name: 依赖安全与许可证（cargo-deny）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # 阶段 2：阻断。任何 error 级命中（漏洞 / 许可证 / 被禁依赖 / 来源）都会让 job 变红。
      # 将来若出现"暂时无法升级"的条目，写法有两种（都要求可复审）：
      #   a) deny.toml 的 [advisories].ignore 写 ID + 原因；
      #   b) 临时给本 step 加 continue-on-error，同时在这里与 deploy/README 记一笔，别变成永久。
      # 【t180】版本必须 ≥0.20：`error[custom]: expected a <bare-gnu-license>` 是旧版（0.16/0.18）
      # 解析 deny.toml 里 `Apache-2.0 WITH LLVM-exception` 这类 SPDX 表达式时报的；本地用 0.20.2
      # 跑 `cargo deny --all-features check advisories licenses bans sources` 全绿
      # （advisories ok, bans ok, licenses ok, sources ok）。deny.toml 本身没有放宽。
      # 不再用 EmbarkStudios/cargo-deny-action：它在 Docker 里用 `curl --silent | tar -x`
      # 现下二进制，GitHub Release 抖动（504 / 截断 HTML）时会直接 `tar: Error is not recoverable`，
      # 而且 Docker 层不缓存 → 每次 run 都重新承担网络风险。改为：缓存二进制 + 带重试下载 + tar 校验。
      - name: 缓存 cargo-deny 二进制
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-0.20.2
      - name: 安装 cargo-deny（缺失时下载，带重试与 tar 校验）
        env:
          DENY_VERSION: "0.20.2"
        run: |
          set -euo pipefail
          bin="$HOME/.local/bin/cargo-deny"
          mkdir -p "$HOME/.local/bin"
          if [ -x "$bin" ]; then
            echo "cargo-deny 已在缓存中：$($bin --version)"
            exit 0
          fi
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tmp="$(mktemp -d)"
          for attempt in 1 2 3 4 5; do
            echo "下载 cargo-deny（第 $attempt 次）：$url"
            # -f：HTTP 4xx/5xx 直接失败（不会把错误页喂给 tar）；--retry-all-errors：504 也重试
            if curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 20 --max-time 300 -o "$tmp/deny.tgz" "$url"; then
              if tar -tzf "$tmp/deny.tgz" > /dev/null 2>&1; then
                tar -xzf "$tmp/deny.tgz" -C "$tmp"
                found="$(find "$tmp" -type f -name cargo-deny | head -n 1)"
                if [ -n "$found" ]; then
                  install -m 0755 "$found" "$bin"
                  "$bin" --version
                  exit 0
                fi
              fi
              echo "::warning::下载内容不是有效 tar（可能是错误页/截断），重试"
            fi
            sleep $((attempt * 5))
          done
          echo "::error::cargo-deny 下载失败（GitHub Release 资产连续 5 次不可用）。"
          echo "这不是代码问题：稍后用 gh run rerun --failed 重跑本 job 即可；缓存命中后不会再下载。"
          exit 1
      - name: cargo-deny（RustSec 漏洞 / 许可证 / 禁用依赖 / 来源）
        id: deny
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          cargo deny --all-features check advisories licenses bans sources
      # 命中时的定位提示：明细在上一 step 的输出里（crate / version / RUSTSEC-ID /
      # Solution 是否给出修复版本），这里只补充"接下来怎么处理"。
      - name: 命中时的处理指引
        if: steps.deny.outcome == 'failure'
        run: |
          echo "::error::cargo-deny 命中 error 级问题（阶段 2：会阻断合入）"
          echo "上一步输出每条形如：Crate / Version / ID（RUSTSEC-…）/ Solution（有修复版本时会写 Upgrade to …）"
          echo "处理路径：a) 升级依赖（会动 Cargo.lock，单独提 PR 并评估）；b) 确认不可利用则写进 deny.toml 的 ignore 并注明原因；c) 许可证拿不准先报 captain。"

  # 无凭据端到端闭环：mock 上游 ← 服务端容器 ← 脚本客户端（注册 → 登录 → /chat/stream）。
  # 之前 CI 只验证到"各组件单测 + 探针"，没有验证"用户能完成一次对话"。这里不需要
  # 任何真实账号/Key：mock 上游（scripts/mock-upstream/mock_upstream.py）接受任意 Key。
  # 覆盖：正常流契约（meta 首 / usage / done 末且唯一）、上游 500 → 502 不泄露原文、
  # 非 SSE → 502、流内错误帧 → event: error 且洗掉厂商原文、首事件超时 → 504、
  # 100% 抽样落库（psql 断言 usage_samples）、上游失败写审计（audit_logs decision=error）。
  #
  # 观察期已结束（连续多次绿，耗时稳定）：去掉 continue-on-error，命中即红；
  # 已同步加进分支保护必需检查（改名=静默失效，改 name: 前先看 deploy/README）。
  e2e:
    name: 端到端对话闭环（mock 上游）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 启用 buildx
        uses: docker/setup-buildx-action@v4
      # 镜像 OCI label 用的构建元数据：commit / 构建时间 / 版本
      - name: 记录构建元数据（镜像 label 用）
        id: meta
        run: |
          set -euo pipefail
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          version=$(awk -F'"' '/^\[workspace\.package\]/{f=1; next} f && /^\[/{exit} f && /^version[[:space:]]*=/{print $2; exit}' Cargo.toml)
          [ -n "$version" ] || { echo "::error::读不到 Cargo.toml 的 [workspace.package].version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # 与 docker / release 共用同一个 gha 缓存：命中时约 20~30 秒
      - name: docker build（deploy/Dockerfile.server）
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.server
          push: false
          load: true
          tags: yunong-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VERSION=${{ steps.meta.outputs.version }}
      - name: 端到端闭环（mock 上游 + PG + 服务端容器 + 脚本客户端）
        run: python3 scripts/e2e-chat.py --image yunong-server:ci

  # Android 可侧载 APK：交叉编译 Rust 核心成 libyunong_core.so → 打进 APK → 解包确认 .so 在里面。
  #
  # 为什么单独一个 job：它需要 NDK + rust android target + Gradle，与桌面端/服务端链路完全不同。
  # **暂不进分支保护必需检查**：Android 现在不阻塞桌面端 alpha 发布，但红了必须看得见。
  android-apk:
    name: Android APK（含 libyunong_core.so）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      # runner 默认 JDK 已是 25，而 Gradle 8.13 只支持到 Java 23（会报
      # "Gradle build failed due to Java/Gradle incompatibility"）→ 固定 JDK 21。
      - name: 固定 JDK 21（Gradle 8.13 不支持 runner 默认的 JDK 25）
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # 【t180】gradle 分发（wrapper 下载 gradle-8.14.3-all.zip）会因 GitHub Release 504 直接失败。
      # setup-gradle 负责缓存/复用 ~/.gradle；wrapper 自身的下载在下一步用 curl 重试兜住。
      - uses: gradle/actions/setup-gradle@v4
      # wrapper 自己的下载**不带重试**，504 时整个 job 直接崩（t180 实测）。
      # 这里先用 curl（-f + 重试）把分发包下到本地，再把 distributionUrl 指向本地文件：
      # wrapper 走 file:// 安装，完全不碰网络。
      - name: 预热 gradle 分发包（curl 重试 + file:// 分发）
        run: |
          set -euo pipefail
          props=app/android/gradle/wrapper/gradle-wrapper.properties
          ver=$(grep -oE 'gradle-[0-9.]+-all\.zip' "$props" | head -n1 | sed -E 's/gradle-([0-9.]+)-all\.zip/\1/')
          [ -n "$ver" ] || { echo "::error::读不到 gradle 版本"; exit 1; }
          zip="$RUNNER_TEMP/gradle-${ver}-all.zip"
          ok=0
          used=""
          # 三源按优先级尝试：官方 → GitHub Release → 腾讯云镜像（captain 实测镜像在 504 期间可用）
          for url in "https://services.gradle.org/distributions/gradle-${ver}-all.zip" \
                     "https://github.com/gradle/gradle-distributions/releases/download/v${ver}/gradle-${ver}-all.zip" \
                     "https://mirrors.cloud.tencent.com/gradle/gradle-${ver}-all.zip"; do
            echo "尝试源：$url"
            if curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 600 -o "$zip" "$url" \
               && unzip -tqq "$zip" > /dev/null 2>&1; then
              ok=1; used="$url"; break
            fi
            echo "::warning::该源不可用或包不完整，换下一个"
          done
          [ "$ok" -eq 1 ] || { echo "::error::gradle ${ver} 分发包三个源均不可用（外部故障）；恢复后 gh run rerun --failed 即可"; exit 1; }
          # 明确打印实际使用的源：排查“为什么这次慢/失败”时先看这一行
          echo "gradle 分发包来源：$used"
          gh_annot="${used}"; echo "::notice::gradle ${ver} 分发包来自 ${gh_annot}"
          sed -i "s#^distributionUrl=.*#distributionUrl=file://${zip}#" "$props"
          grep distributionUrl "$props"
      - name: 确保 NDK 可用
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -n "${ANDROID_NDK_HOME:-}" ] && [ -d "${ANDROID_NDK_HOME:-}" ]; then
            echo "NDK: $ANDROID_NDK_HOME"; exit 0
          fi
          if [ -d "$sdk/ndk" ] && [ -n "$(ls -A "$sdk/ndk" 2>/dev/null)" ]; then
            echo "NDK: $(ls -A "$sdk/ndk")"; exit 0
          fi
          echo "::notice::runner 无预装 NDK，安装 ndk;27.2.12479018"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
      # 脚本本身带 NDK/target 检查与清晰的错误提示；Linux 上 pwsh 由 runner 预装
      - name: 交叉编译 Rust 核心（arm64-v8a）
        run: pwsh scripts/build-android-core.ps1 -Abi arm64-v8a
      - name: flutter pub get
        working-directory: app
        run: flutter pub get
      # 没有 key.properties 时 gradle 自动回退 debug 签名（本 PR 已加），所以能直接侧载
      - name: 构建 APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64
      - name: 验证 APK 内含 lib/arm64-v8a/libyunong_core.so
        run: |
          set -euo pipefail
          apk=app/build/app/outputs/flutter-apk/app-release.apk
          [ -f "$apk" ] || { echo "::error::APK 未产出：$apk"; exit 1; }
          ls -l "$apk"
          echo "--- APK 里的 lib/ ---"
          unzip -l "$apk" | awk '$4 ~ /^lib\// {print}' || true
          if ! unzip -l "$apk" | grep -q 'lib/arm64-v8a/libyunong_core.so'; then
            echo "::error::APK 里没有 lib/arm64-v8a/libyunong_core.so —— 装上去 FFI 会加载失败"
            exit 1
          fi
          echo "OK：APK 内含 lib/arm64-v8a/libyunong_core.so"
      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: yunong-apk-ci-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  # 密钥泄露防护：owner 的真实 API Key 曾被写进测试代码并推到 GitHub（已吊销 + 脱敏）。
  # 这道闸让"把密钥写进代码"在提交前（pre-commit 钩子）和合并前（CI）都直接失败。
  # 规则只有一份：scripts/secret-scan.py —— 钩子脚本装的也是它，不要写第二份。
  #
  # 观察期已结束：去掉 continue-on-error，命中即红；已同步加进分支保护必需检查。
  secret-scan:
    name: 密钥扫描（secret scanning）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # 扫 git 跟踪的文件（不含 ignored / 未跟踪文件），规则清单见脚本头部注释
      - name: 扫描密钥（规则与 pre-commit 钩子共用 scripts/secret-scan.py）
        run: python3 scripts/secret-scan.py --all
