<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>云农之窗 · 校园智能助理</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="云农之窗">
<link rel="icon" type="image/png" sizes="512x512" href="/static/logo.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<script>
  // 在首次绘制前恢复折叠状态，避免展开态闪一下再收起
  try {
    if (localStorage.getItem('sidebar-collapsed') === '1' &&
        window.matchMedia('(min-width: 768px)').matches) {
      document.documentElement.classList.add('sidebar-collapsed');
    }
  } catch (e) { /* localStorage 不可用时忽略 */ }
</script>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <div class="app">
    <!-- 顶部：品牌 + 状态 + 全局操作 -->
    <header class="app-header">
      <button id="menuToggle"
              class="inline-flex md:hidden items-center justify-center w-10 h-10 rounded-lg text-gray-500 bg-transparent transition-all duration-150 ease-out hover:bg-gray-100 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:scale-[0.98] active:translate-y-0 active:shadow-sm"
              aria-label="打开菜单" aria-expanded="false" aria-controls="sidebar">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>

      <div class="flex items-center gap-3 min-w-0">
        <span class="block w-10 h-10 rounded-xl overflow-hidden bg-white border border-gray-200 shadow-sm shrink-0">
          <img src="/static/logo.png" alt="云农之窗" class="block w-full h-full object-cover">
        </span>
        <div class="flex flex-col min-w-0 leading-tight">
          <h1 class="text-base font-semibold tracking-tight text-gray-900 whitespace-nowrap">云农之窗</h1>
          <span class="text-xs text-gray-500 whitespace-nowrap hidden sm:block">云南农业大学 · 校园智能助理</span>
        </div>
      </div>

      <div class="flex items-center gap-2 md:gap-3 ml-auto shrink-0">
        <span class="hidden sm:inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-green-50 border border-green-200 text-green-700 text-xs font-medium">
          <span class="w-2 h-2 rounded-full bg-green-500" aria-hidden="true"></span>在线
        </span>
        <button id="newChatBtn" type="button" aria-label="开始新对话"
                class="inline-flex items-center justify-center gap-2 w-10 h-10 sm:w-auto sm:px-3 rounded-lg bg-blue-600 text-white text-sm font-medium shadow-sm transition-all duration-150 ease-out hover:-translate-y-0.5 hover:shadow hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:scale-[0.98] active:translate-y-0 active:shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <span class="hidden sm:inline">新对话</span>
        </button>
        <button id="memoryBtn" type="button" aria-label="查看我的记忆"
                class="inline-flex items-center justify-center gap-2 w-10 h-10 sm:w-auto sm:px-3 rounded-lg bg-white border border-gray-300 text-gray-700 text-sm font-medium shadow-sm transition-all duration-150 ease-out hover:-translate-y-0.5 hover:shadow hover:bg-gray-50 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:scale-[0.98] active:translate-y-0 active:shadow-sm">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/>
          </svg>
          <span class="hidden sm:inline">记忆</span>
        </button>
        <button id="themeToggle" type="button" title="切换主题" aria-label="切换深色 / 浅色主题"
                class="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-white border border-gray-300 text-gray-500 shadow-sm transition-all duration-150 ease-out hover:-translate-y-0.5 hover:shadow hover:bg-gray-50 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:scale-[0.98] active:translate-y-0 active:shadow-sm">
          <svg id="iconSun" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg id="iconMoon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </header>

    <div class="main-body">
      <div class="sidebar-overlay" id="sidebarOverlay"></div>

      <!-- 侧边：校园系统直达 -->
      <aside class="sidebar" id="sidebar" aria-label="校园系统入口">
        <div class="sidebar-head flex items-center justify-between gap-2 px-2 pb-3 shrink-0">
          <span class="sidebar-title text-xs font-semibold text-gray-500 whitespace-nowrap">校园直达</span>
          <button id="sidebarCollapse" type="button" aria-label="收起侧边栏" aria-expanded="true" aria-controls="sidebar" title="收起侧边栏"
                  class="sidebar-collapse hidden md:inline-flex items-center justify-center w-7 h-7 rounded-lg bg-white border border-gray-200 text-gray-500 shadow-sm transition-all duration-150 ease-out hover:text-blue-600 hover:border-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:scale-[0.98] active:translate-y-0 active:shadow-sm">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
        </div>

        <nav class="flex flex-col gap-1" aria-label="校园系统列表">
          <a href="/go/portal" target="_blank" rel="noopener" class="nav-item group flex items-center gap-3 px-2.5 py-2 rounded-lg text-sm font-medium text-gray-700 transition-all duration-150 ease-out hover:bg-blue-50 hover:text-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:scale-[0.98] active:translate-y-0 active:shadow-sm" title="教务集成">
            <span class="flex items-center justify-center w-8 h-8 rounded-lg bg-gray-100 text-gray-500 shrink-0 transition-all duration-200 ease-out group-hover:bg-blue-500 group-hover:text-white group-hover:scale-110 hover:bg-blue-500 hover:text-white hover:scale-110">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
            </span>
            <span class="nav-label truncate">教务集成</span>
          </a>
          <a href="/go/jwxt" target="_blank" rel="noopener" class="nav-item group flex items-center gap-3 px-2.5 py-2 rounded-lg text-sm font-medium text-gray-700 transition-all duration-150 ease-out hover:bg-blue-50 hover:text-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:scale-[0.98] active:translate-y-0 active:shadow-sm" title="教务平台">
            <span class="flex items-center justify-center w-8 h-8 rounded-lg bg-gray-100 text-gray-500 shrink-0 transition-all duration-200 ease-out group-hover:bg-blue-500 group-hover:text-white group-hover:scale-110 hover:bg-blue-500 hover:text-white hover:scale-110">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>
            </span>
            <span class="nav-label truncate">教务平台</span>
          </a>
          <a href="/go/score" target="_blank" rel="noopener" class="nav-item group flex items-center gap-3 px-2.5 py-2 rounded-lg text-sm font-medium text-gray-700 transition-all duration-150 ease-out hover:bg-blue-50 hover:text-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:scale-[0.98] active:translate-y-0 active:shadow-sm" title="查成绩">
            <span class="flex items-center justify-center w-8 h-8 rounded-lg bg-gray-100 text-gray-500 shrink-0 transition-all duration-200 ease-out group-hover:bg-blue-500 group-hover:text-white group-hover:scale-110 hover:bg-blue-500 hover:text-white hover:scale-110">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
            </span>
            <span class="nav-label truncate">查成绩</span>
          </a>
          <a href="/go/table" target="_blank" rel="noopener" class="nav-item group flex items-center gap-3 px-2.5 py-2 rounded-lg text-sm font-medium text-gray-700 transition-all duration-150 ease-out hover:bg-blue-50 hover:text-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:scale-[0.98] active:translate-y-0 active:shadow-sm" title="一表通">
            <span class="flex items-center justify-center w-8 h-8 rounded-lg bg-gray-100 text-gray-500 shrink-0 transition-all duration-200 ease-out group-hover:bg-blue-500 group-hover:text-white group-hover:scale-110 hover:bg-blue-500 hover:text-white hover:scale-110">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/></svg>
            </span>
            <span class="nav-label truncate">一表通</span>
          </a>
          <a href="/go/library" target="_blank" rel="noopener" class="nav-item group flex items-center gap-3 px-2.5 py-2 rounded-lg text-sm font-medium text-gray-700 transition-all duration-150 ease-out hover:bg-blue-50 hover:text-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:scale-[0.98] active:translate-y-0 active:shadow-sm" title="图书检索系统">
            <span class="flex items-center justify-center w-8 h-8 rounded-lg bg-gray-100 text-gray-500 shrink-0 transition-all duration-200 ease-out group-hover:bg-blue-500 group-hover:text-white group-hover:scale-110 hover:bg-blue-500 hover:text-white hover:scale-110">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            </span>
            <span class="nav-label truncate">图书检索</span>
          </a>
          <a href="/go/software" target="_blank" rel="noopener" class="nav-item group flex items-center gap-3 px-2.5 py-2 rounded-lg text-sm font-medium text-gray-700 transition-all duration-150 ease-out hover:bg-blue-50 hover:text-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:scale-[0.98] active:translate-y-0 active:shadow-sm" title="正版软件">
            <span class="flex items-center justify-center w-8 h-8 rounded-lg bg-gray-100 text-gray-500 shrink-0 transition-all duration-200 ease-out group-hover:bg-blue-500 group-hover:text-white group-hover:scale-110 hover:bg-blue-500 hover:text-white hover:scale-110">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
            </span>
            <span class="nav-label truncate">正版软件</span>
          </a>
        </nav>

        <div class="sidebar-foot mt-auto flex flex-col gap-1 pt-4 px-2 text-xs text-gray-500 border-t border-gray-200">
          <span>点击上方入口</span>
          <span>直接跳转校园系统</span>
        </div>
      </aside>

      <!-- 主区：对话 -->
      <main id="chatArea" class="chat-area is-empty">
        <section id="hero" class="hero">
          <h2 class="text-2xl md:text-4xl font-semibold tracking-tight text-gray-900 leading-tight">
            云农之窗，<span class="text-blue-600">你的校园助理</span>
          </h2>
          <p class="mt-4 text-sm md:text-base text-gray-500 leading-relaxed max-w-xl mx-auto">
            云南农业大学 · 教务、成绩、课表、图书馆，一句话就能问
          </p>
        </section>

        <div id="messages" class="messages" role="log" aria-live="polite" aria-label="对话记录"></div>

        <div class="input-wrap">
          <div id="fileChip" class="items-center gap-2 max-w-3xl mx-auto mb-2 px-3 py-2 rounded-lg bg-blue-50 border border-blue-200 text-blue-600 text-xs font-medium" style="display:none" role="status">
            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
            <span id="fileChipName" class="flex-1 truncate"></span>
            <button id="fileChipClose" type="button" title="移除文档" aria-label="移除当前文档"
                    class="inline-flex items-center justify-center w-6 h-6 rounded-md bg-transparent text-blue-600 transition-all duration-150 ease-out hover:bg-blue-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:scale-[0.98] active:translate-y-0 active:shadow-sm">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>

          <div id="inputBar"
               class="composer flex items-end gap-2 rounded-xl border border-gray-300 bg-white px-3 py-2 shadow-sm transition-all duration-200 ease-out focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500 focus-within:ring-offset-2">
            <label for="input" class="sr-only">向云农之窗提问</label>
            <textarea id="input" rows="1" autocomplete="off"
                      class="block flex-1 min-w-0 bg-transparent border-0 text-sm md:text-base leading-6 text-gray-900 placeholder-gray-400 resize-none py-2 focus:outline-none"
                      placeholder="向云农之窗提问…"></textarea>
            <input type="file" id="fileInput" class="hidden" accept="image/*,.pdf,.doc,.docx,.txt,.md,.csv,.xlsx,.pptx,.json">
            <button id="attachBtn" type="button" title="上传图片或文档" aria-label="上传图片或文档"
                    class="shrink-0 inline-flex items-center justify-center w-10 h-10 rounded-lg bg-transparent text-gray-500 transition-all duration-150 ease-out hover:bg-gray-100 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:scale-[0.98] active:translate-y-0 active:shadow-sm">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <button id="send" type="button" title="发送" aria-label="发送"
                    class="shrink-0 inline-flex items-center justify-center w-10 h-10 rounded-lg bg-blue-600 text-white shadow-sm transition-all duration-150 ease-out hover:bg-blue-700 hover:-translate-y-0.5 hover:shadow focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:scale-[0.98] active:translate-y-0 active:shadow-sm disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0 disabled:hover:shadow-sm disabled:hover:bg-blue-600">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
            </button>
          </div>

          <div id="heroChips" class="chips"></div>
          <div class="flex flex-wrap items-center justify-center gap-x-4 gap-y-1 mt-3 px-1 text-xs text-gray-500">
            <span>内容由 AI 生成，仅供参考</span>
            <span class="hidden sm:inline">Enter 发送 · Shift+Enter 换行</span>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- 记忆面板 -->
  <div class="memory-modal" id="memoryModal" aria-hidden="true">
    <div class="memory-backdrop" id="memoryBackdrop"></div>
    <div class="memory-panel bg-white border-l border-gray-200 shadow-md" role="dialog" aria-modal="true" aria-labelledby="memoryTitle">
      <div class="flex items-start gap-3 px-6 pt-6 pb-4 border-b border-gray-200">
        <div class="min-w-0">
          <h2 id="memoryTitle" class="text-lg font-semibold tracking-tight text-gray-900">我的记忆</h2>
          <p class="mt-1 text-xs text-gray-500">云农之窗通过对话记住的关于你的信息</p>
        </div>
        <button id="memoryClose" type="button" aria-label="关闭记忆面板"
                class="ml-auto shrink-0 inline-flex items-center justify-center w-10 h-10 rounded-lg bg-transparent text-gray-500 transition-all duration-150 ease-out hover:bg-gray-100 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:scale-[0.98] active:translate-y-0 active:shadow-sm">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="memory-body" id="memoryBody"></div>

      <div class="memory-foot flex items-center gap-3 px-6 py-4 border-t border-gray-200">
        <button id="memoryRefresh" type="button"
                class="inline-flex items-center justify-center h-10 px-4 rounded-lg bg-white border border-gray-300 text-gray-700 text-sm font-medium shadow-sm transition-all duration-150 ease-out hover:-translate-y-0.5 hover:shadow hover:bg-gray-50 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:scale-[0.98] active:translate-y-0 active:shadow-sm">
          刷新
        </button>
        <button id="memoryReset" type="button"
                class="ml-auto inline-flex items-center justify-center h-10 px-4 rounded-lg bg-white border border-red-200 text-red-600 text-sm font-medium shadow-sm transition-all duration-150 ease-out hover:-translate-y-0.5 hover:shadow hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:scale-[0.98] active:translate-y-0 active:shadow-sm">
          清空自动记忆
        </button>
      </div>
    </div>
  </div>

<script src="app.js?v=3"></script>
</body>
</html>
