name: yunong
description: "云农之窗 · 校园智能助理（Android / Windows）"
publish_to: "none"
version: 0.9.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # 校务系统内嵌浏览器（ADR-11：Cookie 只留本机）；自带 Windows 实现，不再引 webview_windows
  flutter_inappwebview: ^6.1.5
  # 纯 Dart 包（不是插件）：dart:ffi 的 Utf8/内存辅助
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fixtures/
    # 纸纹平铺图（8×8 PNG，126 B）：仅 C「书本质感」主题用，ImageRepeat.repeat 铺满，
    # 不做模糊/不做动画，成本可忽略。由 t36/t38 主题方案批准新增。
    - assets/textures/
