name: yunong
description: "云农之窗 · 校园智能助理（Android / Windows）"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # 校务系统内嵌浏览器（ADR-11：Cookie 只留本机）；自带 Windows 实现，不再引 webview_windows
  flutter_inappwebview: ^6.1.5
  # 纯 Dart 包（不是插件）：dart:ffi 的 Utf8/内存辅助
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fixtures/
