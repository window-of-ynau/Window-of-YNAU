# 云农之窗 · 单机部署（PostgreSQL/pgvector + axum server）
#
# 用法：
#   cp deploy/.env.example deploy/.env    # 填 POSTGRES_PASSWORD 与 DATABASE_URL
#   docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --build
#
# 显式 --env-file 是为了不依赖"在哪个目录执行 compose"；变量先来自 deploy/.env，
# 也可用同名 shell 环境变量覆盖。

name: yunong

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: yunong
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在 deploy/.env 里设置 POSTGRES_PASSWORD}
      POSTGRES_DB: yunong
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yunong -d yunong"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - internal
    # 刻意不映射端口：数据库只给 server 用，宿主机和公网都碰不到。

  # 一次性迁移任务：按 schema_migrations 幂等应用 crates/server/migrations/*.sql。
  # 没有它，全新环境里数据库是空的，服务端启动自检会拒绝启动（有意设计）。
  migrate:
    image: pgvector/pgvector:pg16
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?请先在 deploy/.env 里设置 POSTGRES_PASSWORD}
      PGHOST: db
      PGUSER: yunong
      PGDATABASE: yunong
    volumes:
      - ../crates/server/migrations:/migrations:ro
      - ./migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    networks:
      - internal
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # db 是 compose 内部服务名，所以 .env 里用 postgres://...@db:5432/...
      DATABASE_URL: ${DATABASE_URL:?请先在 deploy/.env 里设置 DATABASE_URL}
      # 容器内必须监听 0.0.0.0，否则 ports 映射进来的流量到不了服务（宿主机侧仍只绑回环）
      YUNONG_BIND: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-info}
      # 套餐按时间授权、不做 token 记账；这里限的是"同时在途流"，不是额度。
      CONCURRENCY_LIMIT: ${CONCURRENCY_LIMIT:-50}
      # 单轮输入 token 上限（先拒后转，避免把超额请求发给上游产生费用）。
      MAX_INPUT_TOKENS: ${MAX_INPUT_TOKENS:-32000}
      # 上游：默认三家共用 UPSTREAM_BASE_URL/KEY；也可按协议分别覆盖。
      # 空值会被服务端忽略（var() 会过滤空串），所以留空是安全的。
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}
      UPSTREAM_COMPLETIONS_URL: ${UPSTREAM_COMPLETIONS_URL:-}
      UPSTREAM_COMPLETIONS_KEY: ${UPSTREAM_COMPLETIONS_KEY:-}
      UPSTREAM_RESPONSES_URL: ${UPSTREAM_RESPONSES_URL:-}
      UPSTREAM_RESPONSES_KEY: ${UPSTREAM_RESPONSES_KEY:-}
      UPSTREAM_MESSAGES_URL: ${UPSTREAM_MESSAGES_URL:-}
      UPSTREAM_MESSAGES_KEY: ${UPSTREAM_MESSAGES_KEY:-}
      # 上游超时（秒）：建连 / 首字节与空闲
      # 三段超时：建连 / 首事件（推理模型可能 30~60s 才吐第一个 token）/ 事件间空闲
      UPSTREAM_CONNECT_TIMEOUT_SECS: ${UPSTREAM_CONNECT_TIMEOUT_SECS:-10}
      UPSTREAM_FIRST_EVENT_TIMEOUT_SECS: ${UPSTREAM_FIRST_EVENT_TIMEOUT_SECS:-90}
      UPSTREAM_IDLE_TIMEOUT_SECS: ${UPSTREAM_IDLE_TIMEOUT_SECS:-30}
      # 闸门排队与心跳
      CONCURRENCY_QUEUE_MS: ${CONCURRENCY_QUEUE_MS:-5000}
      SSE_HEARTBEAT_SECS: ${SSE_HEARTBEAT_SECS:-15}
      # 1% 抽样记账（只用于成本监控，不是账单）
      USAGE_SAMPLE_PERCENT: ${USAGE_SAMPLE_PERCENT:-1}
    ports:
      # 默认只绑宿主机回环，前面挂 Caddy/Nginx 做 TLS。
      # 真机联调要局域网直连时，再改成 "0.0.0.0:8080:8080"（或设 SERVER_BIND）。
      - "${SERVER_BIND:-127.0.0.1}:8080:8080"
    networks:
      - internal   # 用 db
      - edge       # 出网调用模型上游
    stop_grace_period: 20s

networks:
  internal:
    internal: true   # db 只在这个网络里，没有外网出口
  edge:
    driver: bridge

volumes:
  pgdata:
