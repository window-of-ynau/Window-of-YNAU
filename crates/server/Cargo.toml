[package]
name = "yunong-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "云农之窗服务端：鉴权、代理转发、配额、知识检索、审计"

[dependencies]
# 内部 path 依赖也写死版本：cargo-deny 的 wildcard 检查不允许"只有 path 没有版本"
# （版本必须与 workspace.package.version 一致，升 workspace 版本时这里要同步）
yunong-shared = { path = "../shared", version = "0.1.0" }
# 三协议适配（build_body / parse_events）：服务端**只做转发 + 记账**，
# 协议解析一律复用 core，避免端与服务端各写一份（ADR-13 / ADR-16）。
yunong-core = { path = "../core", version = "0.1.0" }
axum = "0.8"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "time",
    # SSE 代理需要：闸门用的是 Semaphore（sync），上游 socket 用读写扩展（io-util）
    "sync",
    "io-util",
] }
tower-http = { version = "0.6", features = ["trace", "request-id", "cors", "limit", "timeout"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
# SSE 响应体是 `Stream`：`Body::from_stream` 要的正是这个 trait（TryStream 同在 futures-core）
futures-core = "0.3"
dotenvy = "0.15"
anyhow = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "migrate"] }
# 上游转发用的 HTTP 客户端：生产上游（DeepSeek / Anthropic）都是 https，
# TLS 走 rustls + webpki 根证书；刻意不加 `stream` feature——SSE 用 `response.chunk()` 循环读。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# 鉴权：密码哈希（Argon2id）与令牌摘要（SHA-256 → hex）
argon2 = "0.5"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
