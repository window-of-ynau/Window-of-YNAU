[package]
name = "yunong-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "云农之窗服务端：鉴权、代理转发、配额、知识检索、审计"

[dependencies]
yunong-shared = { path = "../shared" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "cors", "limit", "timeout"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
dotenvy = "0.15"
anyhow = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "migrate"] }
# 鉴权：密码哈希（Argon2id）与令牌摘要（SHA-256 → hex）
argon2 = "0.5"
sha2 = "0.11"
hex = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
